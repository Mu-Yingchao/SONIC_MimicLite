# @package task
defaults:
  - command/future_steps: short
  - observation/priv: root_body_actions
  - observation/command: joint
  - termination: base
  - motion: bumi/v2
  - _self_

name: BumiV2TrackBase
project: mimic_lite

shared:
  root_body_name: base_link
  anchor_body_name: base_link
  reward_root_body_name: waist_yaw_link
  termination_root_body_name: waist_yaw_link
  obs_body_names:
    - "base_link"
    - ".*_knee_pitch_link"
    - ".*_ankle_roll_link"
    - ".*_arm_yaw_link"
    - ".*_elbow_pitch_link"

  tracking_body_names:
    - "base_link"
    - "waist_yaw_link"
    - ".*_leg_yaw_link"
    - ".*_knee_pitch_link"
    - ".*_ankle_roll_link"
    - ".*_arm_yaw_link"
    - ".*_elbow_pitch_link"
  tracking_joint_names:
    - "waist_yaw_joint"
    - ".*_leg_.*_joint"
    - ".*_knee_pitch_joint"
    - ".*_ankle_.*_joint"
    - ".*_arm_.*_joint"
    - ".*_elbow_pitch_joint"
  reward_joint_names:
    - "waist_yaw_joint"
    - ".*_leg_.*_joint"
    - ".*_knee_pitch_joint"
    - ".*_arm_.*_joint"
    - ".*_elbow_pitch_joint"

viewer:
  resolution: [1280, 720]
  lookat: [0.0, 0.0, 0.0]
  eye: [4.0, 4.0, 4.0]

terrain: plane
enable_cameras: false

num_envs: 8192
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  # Keep BUMI contact/constraint capacities independent from G1 tuning.
  mjlab_nconmax: 256
  mjlab_njmax: 1280
  mjlab_occupancy_diagnostics: false

robot:
  name: bumi-v2

input:
  action:
    _target_: mimic_lite.JointPosition
    action_scaling:
      .*_leg_yaw_joint: 0.45
      .*_leg_roll_joint: 0.35
      .*_leg_pitch_joint: 0.45
      .*_knee_pitch_joint: 0.35
      .*_ankle_pitch_joint: 0.30
      .*_ankle_roll_joint: 0.25
      waist_yaw_joint: 0.45
      .*_arm_pitch_joint: 0.40
      .*_arm_roll_joint: 0.40
      .*_arm_yaw_joint: 0.40
      .*_elbow_pitch_joint: 0.40
    # BUMI control-loop latency: include the zero-delay nominal path and cover
    # up to four 50 Hz policy steps (80 ms) during training.
    min_delay: 0
    max_delay: 4
    alpha_range: [0.8, 1.0]

command:
# command[240]：参考动作信息
# 使用 8 个参考时刻：
# [-8, -4, -2, 0, 1, 2, 3, 4]
  _target_: mimic_lite.RobotTracking
  motion_cfgs: ???
  tracking_body_names: ${task.shared.tracking_body_names}
  obs_body_names: ${task.shared.obs_body_names}
  tracking_joint_names: ${task.shared.tracking_joint_names}
  diff_future_steps: [0, 1]
  root_body_name: ${task.shared.root_body_name}
  anchor_body_name: ${task.shared.anchor_body_name}

  # TODO: put this into randomization reset callbacks
  pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]
    z: [-0.01, 0.01]
    roll: [-0.1, 0.1]
    pitch: [-0.1, 0.1]
    yaw: [-0.1, 0.1]
  velocity_range:
    x: [-0.2, 0.2]
    y: [-0.2, 0.2]
    z: [-0.2, 0.2]
    roll: [-0.5, 0.5]
    pitch: [-0.5, 0.5]
    yaw: [-0.5, 0.5]

  init_joint_pos_noise: 0.1
  init_joint_vel_noise: 0.1

  rewind_prob: 0.8
  rewind_steps_range: [25, 125]

observation:
  policy:
  # policy[399] ：机器人本体状态
  # 是从“当前策略计算时刻”向过去取样
  # 取样时刻为：[-16, -8, -4, -3, -2, -1, 0]
    root_ang_vel_history:
      _target_: mimic_lite.root_ang_vel_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.2
    projected_gravity_history:
      _target_: mimic_lite.projected_gravity_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.01
    joint_pos_history:
      _target_: mimic_lite.joint_pos_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.02
    joint_vel_history:
      _target_: mimic_lite.joint_vel_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.5
    prev_actions:
      _target_: mimic_lite.prev_actions
      steps: 3
  ref_joint_pos_:
    ref_joint_action:
      _target_: mimic_lite.ref_joint_action
  _motion_length:
    motion_length:
      _target_: mimic_lite.motion_length

reward:
  tracking:
    root_pos:
      _target_: mimic_lite.windowed_root_displacement_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      history_steps: [200]
      enabled: true
      weight: 0.5
      sigma: 0.3
    root_ori:
      _target_: mimic_lite.body_ori_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 0.5
      sigma: 0.4
    root_linvel:
      _target_: mimic_lite.body_lin_vel_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 0.5
      sigma: 1.0
    root_angvel:
      _target_: mimic_lite.body_ang_vel_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 0.5
      sigma: 2.5

    body_pos:
      _target_: mimic_lite.body_pos_local_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      sigma: 0.3
    body_ori:
      _target_: mimic_lite.body_ori_local_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      sigma: 0.4

    body_linvel:
      _target_: mimic_lite.body_lin_vel_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 0.5
      sigma: 1.0
    body_angvel:
      _target_: mimic_lite.body_ang_vel_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 0.5
      sigma: 2.5


    joint_pos:
      _target_: mimic_lite.joint_pos_tracking_product
      joint_names: ${task.shared.reward_joint_names}
      weight: 0.5
      sigma: 0.25
    joint_vel:
      _target_: mimic_lite.joint_vel_tracking_product
      joint_names: ${task.shared.reward_joint_names}
      weight: 0.5
      sigma: 2.5

  loco:
    action_rate_l2:     {weight: 0.1, enabled: true}
    joint_vel_l2:       {weight: 1.0e-4, joint_names: .*}
    joint_pos_limits:  
      _target_: mimic_lite.joint_pos_limits
      weight: 10.0
      joint_names: ".*"
      soft_factor: 0.9
      enabled: true
    self_collisions:
      _target_: mimic_lite.self_collisions
      weight: -1.0
      enabled: true
      sensor_name: self_collision
      force_threshold: 1.0

    feet_slip:
      _target_: mimic_lite.feet_slip
      weight: 0.5
      tolerance: 0.0
      enabled: false
      body_names: .*ankle_roll_link

    feet_air_time:
      _target_: mimic_lite.feet_air_time
      weight: 4.0
      enabled: true
      body_names: [l_ankle_roll_link, r_ankle_roll_link]
      # BUMI has no separate toe bodies; use the ankle-roll/foot bodies.
      body2_names: null
      thres: 0.8
      # height_range: [0.035, 0.155]
      height_range: [0.05, 0.15]
      time_factor_range: [0.2, 1.0]

    survival:           {weight: 4.0, enabled: true}
  tracking_metrics:
    _enabled_: false
    root_pos:
      _target_: mimic_lite.body_pos_error
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 1.0
      enabled: false
    root_ori:
      _target_: mimic_lite.body_ori_error
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 1.0
      enabled: false
    body_pos:
      _target_: mimic_lite.body_pos_error_local
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      enabled: false
    body_ori:
      _target_: mimic_lite.body_ori_error_local
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      enabled: false
    joint_pos:
      _target_: mimic_lite.joint_pos_error
      joint_names: ${task.shared.reward_joint_names}
      weight: 1.0
      enabled: false
  loco_metrics:
    _enabled_: false
    joint_pos_limits:   
      _target_: mimic_lite.joint_pos_limits
      weight: 1.0
      joint_names: ".*"
      soft_factor: 0.9
      enabled: false
    
    feet_contact_count:
      _target_: mimic_lite.feet_contact_count
      weight: 1.0
      enabled: false
      body_names: .*ankle_roll_link

    feet_contact_duration:
      _target_: mimic_lite.feet_contact_duration
      weight: 1.0
      enabled: false
      body_names: .*ankle_roll_link

randomization:
  # startup
  perturb_body_materials:
    # Match the local BUMI mimic task: every collision body uses the same
    # sampled material. MJLab applies sliding friction and solref directly;
    # dynamic friction and restitution remain effective on IsaacLab.
    body_names: [".*"]
    static_friction_range: [0.3, 1.0]
    dynamic_friction_range: [0.3, 1.0]
    restitution_range: [0.0, 0.5]
    solref_time_constant_range: [0.015, 0.03]
    solref_dampratio_range: [0.7, 1.5]
    homogeneous: true

  perturb_body_mass:
    # active-adaptation expects multiplicative scales. These bounds are the
    # local task's [-2, +5] kg offsets converted using the 6.39671 kg waist.
    waist_yaw_link: [0.8, 1.2]
  perturb_body_com:
    # This backend currently accepts one isotropic range per body; use the
    # largest local per-axis bound (x/z = 5 cm, y = 2 cm).
    waist_yaw_link: [-0.05, 0.05]

  actuator_params:
    stiffness_range:
      ".*": [0.7, 1.2]
    damping_range:
      ".*": [0.7, 1.2]
    armature_range:
      # Multipliers relative to the nominal ankle armature configured by the asset.
      ".*_ankle_pitch_joint": [1.0, 1.2]
      ".*_ankle_roll_joint": [1.2, 1.5]
    friction_range:
      # The remote API takes absolute friction loss; the local scale cannot be
      # used because BUMI's configured nominal actuator friction is zero.
      ".*_ankle_.*_joint": [0.05, 0.25]


  # reset
  random_joint_offset:
    ".*": [-0.01, 0.01]

  # interval
  perturb_root_vel:
    min_s: 4.0
    max_s: 6.0

    x: [-0.2, 0.2]
    y: [-0.2, 0.2]
    z: [-0.1, 0.1]
    roll: [-0.2, 0.2]
    pitch: [-0.2, 0.2]
    yaw: [-0.4, 0.4]
